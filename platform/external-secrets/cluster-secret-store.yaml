# Un solo ClusterSecretStore hacia Secret Manager para todo el cluster.
# ESO se autentica con Workload Identity (KSA external-secrets ↔ GSA), sin llaves.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: my-project
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: gke-demo
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  # Cada namespace solo puede leer secretos con su prefijo (ver README).
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.example.io/enabled: "true"
