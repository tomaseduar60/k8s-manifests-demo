apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders-qa
resources:
  - ../../base
labels:
  - pairs:
      environment: qa
    includeSelectors: false
images:
  - name: us-docker.pkg.dev/my-project/apps/orders-api
    newTag: "0000000" # lo actualiza el pipeline con el head SHA del PR
  - name: us-docker.pkg.dev/my-project/apps/orders-worker
    newTag: "0000000"
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: Deployment
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
  - target:
      kind: Ingress
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: orders.qa.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: orders.qa.example.com
  - target:
      kind: KafkaTopic
      name: orders-created
    patch: |-
      - op: replace
        path: /spec/topicName
        value: qa.orders.orders-created
  - target:
      kind: KafkaTopic
      name: orders-created-dlq
    patch: |-
      - op: replace
        path: /spec/topicName
        value: qa.orders.orders-created-dlq
