# Un ExternalSecret arma UN Secret con todas las keys de la app desde Secret Manager.
# Convención de nombres en Secret Manager: <app>-<key-en-kebab>.
# Con el mismo patrón en cada namespace, sumar una key es agregar dos líneas.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: orders-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: orders-api-mongo-uri
    - secretKey: KAFKA_API_KEY
      remoteRef:
        key: orders-api-kafka-api-key
    - secretKey: KAFKA_API_SECRET
      remoteRef:
        key: orders-api-kafka-api-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: orders-api-redis-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: orders-api-jwt-secret
