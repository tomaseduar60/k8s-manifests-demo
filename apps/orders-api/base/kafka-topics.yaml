# Topics que usa el servicio, pedidos como claims de Crossplane en su namespace.
# La Composition (platform/crossplane) los crea en Confluent Cloud.
apiVersion: platform.example.io/v1alpha1
kind: KafkaTopic
metadata:
  name: orders-created
spec:
  topicName: orders.orders-created
  partitions: 12
  retentionMs: 604800000
  compositionSelector:
    matchLabels:
      provider: confluent
---
apiVersion: platform.example.io/v1alpha1
kind: KafkaTopic
metadata:
  name: orders-created-dlq
spec:
  topicName: orders.orders-created-dlq
  partitions: 3
  retentionMs: 1209600000
  compositionSelector:
    matchLabels:
      provider: confluent
