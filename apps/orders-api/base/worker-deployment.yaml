# Consumidor de Kafka. No tiene HPA: lo escala KEDA según el lag del consumer group.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
    spec:
      serviceAccountName: orders-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: us-docker.pkg.dev/my-project/apps/orders-worker:latest
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: orders-api
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_ORDERS
              valueFrom:
                configMapKeyRef:
                  name: orders-api
                  key: KAFKA_TOPIC_ORDERS
            - name: KAFKA_GROUP_ID
              value: orders-worker
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orders-api
                  key: KAFKA_API_KEY
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: orders-api
                  key: KAFKA_API_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: orders-api
                  key: MONGO_URI
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
